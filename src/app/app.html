<div
  class="mx-auto"
  style="
    max-width: 1440px;
    padding-inline: clamp(1rem, 4vw, 2.5rem);
    padding-block: clamp(1.5rem, 4vw, 2.5rem);
  "
>
  @if (store.loading()) {
    <div class="animate-pulse relative">
      <div class="h-4 w-40 bg-gray-200 rounded-full mb-6"></div>
      <div class="flex gap-1 mb-6">
        <div class="h-8 w-20 bg-gray-200 rounded-full"></div>
        <div class="h-8 w-20 bg-gray-200 rounded-full"></div>
        <div class="h-8 w-20 bg-gray-200 rounded-full"></div>
        <div class="h-8 w-20 bg-gray-200 rounded-full"></div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        @for (i of [1, 2, 3]; track i) {
          <div class="rounded-2xl p-3">
            <div class="h-4 w-16 bg-gray-200 rounded-full mb-3"></div>
            <div class="flex flex-col gap-2">
              <div class="h-16 bg-gray-200 rounded-xl"></div>
              <div class="h-16 bg-gray-200 rounded-xl"></div>
            </div>
          </div>
        }
      </div>
    </div>

    <div class="fixed inset-0 flex items-center justify-center pointer-events-none z-50">
      <img
        src="img/favicon_final.png"
        alt="Lädt"
        class="w-16 h-16 rounded-full shadow-lg animate-spin"
      />
    </div>
  } @else {
    <div class="relative mb-4 w-fit">
      <button
        (click)="toggleProjectMenu()"
        class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-gray-400 font-medium hover:text-gray-900 transition-colors"
      >
        <span class="w-2 h-2 rounded-full" [style.background]="store.activeProject()?.color"></span>
        {{ store.activeProject()?.name }}
      </button>
      @if (projectMenuOpen()) {
        <div
          class="absolute top-6 left-0 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-10 min-w-[180px]"
        >
          @for (p of store.projects(); track p.key) {
            <button
              (click)="switchProject(p.key)"
              class="w-full text-left px-3 py-2 text-xs flex items-center gap-2 hover:bg-gray-50"
              [class.font-semibold]="p.key === store.activeKey()"
            >
              <span class="w-2 h-2 rounded-full" [style.background]="p.color"></span>
              {{ p.name }}
            </button>
          }
          <div class="border-t border-gray-100 mt-1 pt-1">
            @if (!showNewProjectForm()) {
              <button
                (click)="showNewProjectForm.set(true)"
                class="w-full text-left px-3 py-2 text-xs text-gray-500 hover:bg-gray-50"
              >
                + Neues Projekt
              </button>
            } @else {
              <form (ngSubmit)="createProject()" class="px-3 py-2 flex gap-1">
                <input
                  [(ngModel)]="newProjectName"
                  name="newProjectName"
                  placeholder="Projektname"
                  class="flex-1 border border-gray-200 rounded px-2 py-1 text-xs focus:outline-none"
                />
                <button type="submit" class="bg-gray-900 text-white px-2 py-1 rounded text-xs">
                  OK
                </button>
              </form>
            }
          </div>
        </div>
      }
    </div>

    <div
      class="flex items-center gap-1 bg-white border border-gray-200 rounded-full p-1 mb-6 w-fit"
    >
      <button
        (click)="view.set('board')"
        class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-colors"
        [class.bg-gray-900]="view() === 'board'"
        [class.text-white]="view() === 'board'"
        [class.text-gray-500]="view() !== 'board'"
      >
        Board
      </button>
      <button
        (click)="view.set('team')"
        class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-colors"
        [class.bg-gray-900]="view() === 'team'"
        [class.text-white]="view() === 'team'"
        [class.text-gray-500]="view() !== 'team'"
      >
        Team
      </button>
      <button
        (click)="view.set('kalender')"
        class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-colors"
        [class.bg-gray-900]="view() === 'kalender'"
        [class.text-white]="view() === 'kalender'"
        [class.text-gray-500]="view() !== 'kalender'"
      >
        Kalender
      </button>
      <button
        (click)="view.set('dashboard')"
        class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-colors"
        [class.bg-gray-900]="view() === 'dashboard'"
        [class.text-white]="view() === 'dashboard'"
        [class.text-gray-500]="view() !== 'dashboard'"
      >
        Dashboard
      </button>
    </div>

    @switch (view()) {
      @case ('board') {
        <app-board />
      }
      @case ('team') {
        <app-team />
      }
      @case ('kalender') {
        <app-calendar />
      }
      @case ('dashboard') {
        <app-dashboard />
      }
    }
  }
</div>
