<div style="display: flex; gap: 8px; margin-bottom: 16px">
  <button (click)="view.set('board')">Board</button>
  <button (click)="view.set('team')">Team</button>
  <button (click)="view.set('kalender')">Kalender</button>
  <button (click)="view.set('dashboard')">Dashboard</button>
</div>

@switch (view()) {
  @case ('board') {
    <app-board />
  }
  @case ('team') {
    <app-team />
  }
  @case ('kalender') {
    <app-calendar />
  }
  @case ('dashboard') {
    <app-dashboard />
  }
}
