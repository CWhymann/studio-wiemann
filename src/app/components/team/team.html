<div>
  <div style="display: flex; justify-content: space-between; margin-bottom: 16px">
    <span>{{ store.people().length }} Personen</span>
    <button (click)="toggleForm()">+ Person</button>
  </div>

  @if (showForm()) {
    <form (ngSubmit)="submit()" style="margin-bottom: 16px; display: flex; gap: 8px">
      <input [(ngModel)]="pName" name="pName" placeholder="Name" />
      <input [(ngModel)]="pRole" name="pRole" placeholder="Rolle" />
      <input [(ngModel)]="pEmail" name="pEmail" placeholder="E-Mail" />
      <input [(ngModel)]="pPhone" name="pPhone" placeholder="Telefon" />
      <button type="submit">Speichern</button>
    </form>
  }

  <div style="display: flex; gap: 16px; flex-wrap: wrap">
    @for (p of store.people(); track p.id) {
      <div style="border: 1px solid #ccc; padding: 12px; width: 220px">
        <strong>{{ p.name }}</strong>
        <p>{{ p.role }}</p>
        @if (p.email) {
          <p>✉ {{ p.email }}</p>
        }
        @if (p.phone) {
          <p>☎ {{ p.phone }}</p>
        }
      </div>
    }
  </div>
</div>
