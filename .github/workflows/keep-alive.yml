name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error \
            "https://mamxvdqjigdonpzdmaak.supabase.co/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
